<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamDeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/dreamdeck.css">
  <!-- Reihenfolge wichtig: app.js vor Alpine -->
  <script defer src="js/app.js"></script>
  <script defer src="vendor/alpine-3.17.5.min.js"></script>
</head>
<body x-data="dreamdeck" x-cloak>

  <header class="dd-header">
    <div class="dd-brand">
      <svg class="dd-logo" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle class="dd-logo__cyan" cx="15" cy="15" r="13"/>
        <polygon class="dd-logo__magenta" points="15,5 23.7,20 6.3,20"/>
        <polygon class="dd-logo__cyan" points="15,25 6.3,10 23.7,10"/>
      </svg>
      <span>Dream<span class="dd-brand__accent">Deck</span></span>
    </div>

    <nav class="dd-nav" aria-label="Hauptnavigation">
      <a class="dd-nav__item" href="/" aria-current="page">Generieren</a>
      <a class="dd-nav__item" role="link" aria-disabled="true" title="folgt später">Galerie</a>
      <a class="dd-nav__item" role="link" aria-disabled="true" title="folgt später">Prompt-Werkstatt</a>
      <a class="dd-nav__item" role="link" aria-disabled="true" title="folgt später">Rezepte</a>
      <a class="dd-nav__item" role="link" aria-disabled="true" title="folgt später">Einstellungen</a>
    </nav>

    <div class="dd-status" :class="'dd-status--' + comfy">
      <span class="dd-status__dot" aria-hidden="true"></span>
      <span aria-live="polite" x-text="comfyLabel"></span>
    </div>
  </header>

  <main class="dd-main">

    <section class="dd-pipeline" aria-label="Pipeline">
      <template x-for="step in steps" :key="step.n">
        <article class="dd-box" :class="{ 'is-open': isOpen(step.n) }">
          <svg class="dd-box__corner" viewBox="0 0 20 20" aria-hidden="true">
            <line x1="0" y1="0" x2="20" y2="20"/>
          </svg>

          <div class="dd-box__head">
            <div class="dd-box__titles">
              <p class="dd-box__code" x-text="step.code"></p>
              <h2 class="dd-label" x-text="step.title"></h2>
              <p class="dd-box__hint" x-text="hintFor(step)"></p>
            </div>
            <div class="dd-box__actions">
              <button type="button" class="dd-iconbtn"
                      @click="toggle(step.n)"
                      :aria-expanded="isOpen(step.n).toString()"
                      :aria-controls="'dd-box-body-' + step.n"
                      :aria-label="step.title + (isOpen(step.n) ? ' zuklappen' : ' aufklappen')">
                <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                  <polyline points="2,4 6,8 10,4"/>
                </svg>
              </button>
              <button type="button" class="dd-iconbtn"
                      title="Erklärung folgt"
                      :aria-label="'Erklärung zu ' + step.title">i</button>
            </div>
          </div>

          <!-- Zusammenfassung, solange die Box zu ist -->
          <dl class="dd-summary" x-show="!isOpen(step.n)">
            <template x-for="(row, i) in summary(step.n)" :key="i">
              <div class="dd-summary__row">
                <dt x-text="row.k"></dt>
                <dd x-text="row.v"></dd>
              </div>
            </template>
          </dl>

          <div class="dd-box__body" :id="'dd-box-body-' + step.n">
            <!-- Box 3: Format-Regler -->
            <template x-if="step.n === 3">
              <div class="dd-format">

                <div class="dd-format__block">
                  <p class="dd-fieldlabel" id="dd-ratio-label">Seitenverhältnis</p>
                  <div class="dd-format__line">
                    <div class="dd-choices" role="group" aria-labelledby="dd-ratio-label">
                      <template x-for="f in formats" :key="f.key">
                        <div class="dd-choicewrap">
                          <button type="button" class="dd-choice dd-choice--shape"
                                  :class="{ 'dd-choice--wide': f.key === 'eigen' }"
                                  @click="format = f.key"
                                  :aria-pressed="(format === f.key).toString()">
                            <span class="dd-shape-slot">
                              <span class="dd-shape" aria-hidden="true"
                                    :class="{ 'dd-shape--dashed': f.key === 'eigen' }"
                                    :style="shapeStyle(f)"></span>
                            </span>
                            <span x-text="formatLabel(f)"></span>
                          </button>
                          <button type="button" class="dd-rotate"
                                  x-show="f.key !== '1:1'"
                                  @click="rotate(f)"
                                  :aria-label="formatLabel(f) + ' drehen'" title="Hoch/Quer drehen">
                            <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
                              <path d="M13 8a5 5 0 1 1-1.6-3.7"/>
                              <polyline points="13,2 13,5 10,5"/>
                            </svg>
                          </button>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>

                <div class="dd-format__block">
                  <p class="dd-fieldlabel" id="dd-size-label">Größe</p>
                  <div class="dd-format__line">
                    <template x-if="!isCustom">
                      <div class="dd-choices" role="group" aria-labelledby="dd-size-label">
                        <template x-for="s in sizes" :key="s.key">
                          <button type="button" class="dd-choice"
                                  @click="size = s.key"
                                  :aria-pressed="(size === s.key).toString()"
                                  x-text="s.label"></button>
                        </template>
                      </div>
                    </template>
                    <template x-if="isCustom">
                      <div class="dd-choices" role="group" aria-labelledby="dd-size-label">
                        <div class="dd-field dd-field--inline">
                          <label class="dd-fieldlabel" for="dd-custom-w">B</label>
                          <input class="dd-input dd-input--dim" id="dd-custom-w" type="number"
                                 min="256" max="2048" step="16"
                                 :value="custom.w" @change="setCustom('w', $event.target)">
                        </div>
                        <div class="dd-field dd-field--inline">
                          <label class="dd-fieldlabel" for="dd-custom-h">H</label>
                          <input class="dd-input dd-input--dim" id="dd-custom-h" type="number"
                                 min="256" max="2048" step="16"
                                 :value="custom.h" @change="setCustom('h', $event.target)">
                        </div>
                      </div>
                    </template>
                    <div class="dd-resolution">
                      <span class="dd-resolution__dims" x-text="width + ' × ' + height"></span>
                      <span class="dd-resolution__mp" :class="{ 'is-warn': megapixels > 2 }" x-text="mpText"></span>
                    </div>
                  </div>
                </div>

                <div class="dd-fields">
                  <div class="dd-field">
                    <label class="dd-fieldlabel" for="dd-seed">Seed</label>
                    <input class="dd-input" id="dd-seed" type="text" inputmode="numeric"
                           x-model="seed" :readonly="seedMode !== 'fest'">
                  </div>
                  <div class="dd-field">
                    <label class="dd-fieldlabel" for="dd-seed-mode">Seed-Modus</label>
                    <select class="dd-input" id="dd-seed-mode" x-model="seedMode">
                      <option value="zufaellig">zufällig</option>
                      <option value="fest">fest</option>
                    </select>
                  </div>
                  <div class="dd-field">
                    <label class="dd-fieldlabel" for="dd-batch">Anzahl Bilder</label>
                    <input class="dd-input" id="dd-batch" type="number" min="1" max="4"
                           x-model.number="batch" @change="setBatch($event.target)">
                  </div>
                </div>

              </div>
            </template>
            <!-- Box 2: LoRA-Auswahl -->
            <template x-if="step.n === 2">
              <div class="dd-loras">

                <template x-for="lora in loras" :key="lora.id">
                  <div class="dd-lora" :class="{ 'is-on': lora.on }">
                    <div class="dd-lora__line">
                      <button type="button" class="dd-switch"
                              @click="toggleLora(lora.id)"
                              :aria-pressed="lora.on.toString()"
                              :aria-label="loraLabel(lora.name) + ' an oder aus'">
                        <span class="dd-switch__track"></span>
                      </button>
                      <span class="dd-lora__name" :title="lora.name" x-text="loraLabel(lora.name)"></span>
                      <label class="dd-sr-only" :for="'dd-lora-strength-' + lora.id"
                             x-text="'Stärke ' + loraLabel(lora.name) + ' als Zahl'"></label>
                      <input class="dd-input dd-input--strength" :id="'dd-lora-strength-' + lora.id"
                             type="number" min="-2" max="2" step="0.05"
                             x-model.number="lora.strength" @change="setStrength(lora, $event.target)">
                      <button type="button" class="dd-iconbtn"
                              @click="removeLora(lora.id)"
                              :aria-label="loraLabel(lora.name) + ' entfernen'">−</button>
                    </div>
                    <!-- Regler deckt 0–1.5 ab; Werte außerhalb stehen am Rand, das Zahlenfeld zeigt den echten Wert -->
                    <input class="dd-lora__range" type="range" min="0" max="1.5" step="0.05"
                           x-model.number="lora.strength"
                           :aria-label="'Stärke ' + loraLabel(lora.name)">
                  </div>
                </template>

                <p class="dd-lora-note" role="status" x-show="loraState === 'laedt'">Lade LoRAs …</p>
                <div class="dd-lora-note dd-lora-note--err" x-show="loraState === 'fehler'">
                  <span>LoRAs konnten nicht geladen werden</span>
                  <button type="button" class="dd-btn" @click="loadLoras()">Erneut laden</button>
                </div>
                <p class="dd-lora-note" x-show="loraState === 'ok' && loraFiles.length === 0">Keine LoRAs auf dem Pod gefunden</p>
                <p class="dd-lora-note" x-show="loras.length === 0 && loraFiles.length > 0">Noch keine LoRA gewählt</p>

                <div class="dd-lora-actions">
                  <button type="button" class="dd-btn"
                          @click="pickerOpen = !pickerOpen"
                          :aria-expanded="pickerOpen.toString()"
                          aria-controls="dd-lora-picker"
                          :disabled="!canAddLora">+ LoRA</button>
                  <button type="button" class="dd-btn dd-btn--magenta" disabled title="folgt in Etappe 5">Auf Civitai suchen</button>
                </div>

                <div class="dd-picker" id="dd-lora-picker" x-show="pickerOpen">
                  <template x-for="name in freeLoraFiles" :key="name">
                    <button type="button" class="dd-choice dd-picker__item"
                            :title="name" x-text="loraLabel(name)" @click="addLora(name)"></button>
                  </template>
                </div>

              </div>
            </template>
            <!-- Boxen 1, 4 und 5: Platzhalter -->
            <template x-if="step.n !== 2 && step.n !== 3">
              <div class="dd-placeholder" x-text="step.later"></div>
            </template>
          </div>

          <svg class="dd-box__stripes" viewBox="0 0 34 8" aria-hidden="true">
            <polygon points="6,0 18,0 12,8 0,8"/>
            <polygon points="22,0 34,0 28,8 16,8"/>
          </svg>
        </article>
      </template>
    </section>

    <section class="dd-panel dd-prompt" aria-label="Prompt">
      <label class="dd-label" for="dd-prompt-input">Dein Prompt</label>
      <div class="dd-prompt__row">
        <textarea class="dd-prompt__input" id="dd-prompt-input" rows="3"
                  x-model="prompt" maxlength="2000" placeholder="Was soll entstehen?"></textarea>
        <button type="button" class="dd-generate"
                :disabled="busy || !prompt.trim()"
                @click="generate()"
                x-text="busy ? 'Sende …' : 'Generieren'">Generieren</button>
      </div>
      <p class="dd-message" aria-live="polite"
         :class="messageKind ? 'dd-message--' + messageKind : ''"
         x-text="message"></p>
    </section>

    <div class="dd-lower">
      <section class="dd-stage" aria-label="Bühne">
        <p x-show="stage.phase === 'leer'">Hier erscheint dein Bild</p>

        <!-- Statuszeile: sichtbar bei laufendem Auftrag und Fehler; „Fertig“ nur für Vorlesehilfen -->
        <p class="dd-stage__status" aria-live="polite"
           :class="{ 'is-err': stage.phase === 'fehler', 'dd-sr-only': !isRunning && stage.phase !== 'fehler' }"
           x-text="stageText"></p>

        <!-- Fortschrittsbalken: unbestimmt beim Warten und Laden, sonst nach Schritten -->
        <div class="dd-progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0"
             x-show="isRunning"
             :aria-valuenow="progress === null ? null : stage.step"
             :aria-valuemax="progress === null ? null : stage.steps">
          <div class="dd-progress__fill"
               :class="{ 'is-indeterminate': progress === null }"
               :style="{ width: progress === null ? '100%' : (progress * 100) + '%' }"></div>
        </div>

        <!-- Bild mit Info-Spalte; bleibt bei neuem Auftrag und bei Fehler sichtbar -->
        <div class="dd-stage__result" x-show="stage.image">
          <div class="dd-stage__picture">
            <img class="dd-stage__image" alt="Erzeugtes Bild" :src="stage.image?.src">
          </div>
          <div class="dd-stage__side">
            <div class="dd-panel dd-info">
              <dl class="dd-summary">
                <template x-for="(row, i) in stageInfo" :key="i">
                  <div class="dd-summary__row" :class="{ 'dd-summary__row--breit': row.breit }">
                    <dt x-text="row.k"></dt>
                    <dd x-text="row.v"></dd>
                  </div>
                </template>
              </dl>
            </div>
            <div class="dd-actions">
              <button type="button" class="dd-btn" disabled title="folgt in Etappe 3–5">★ Favorit</button>
              <button type="button" class="dd-btn" disabled title="folgt in Etappe 3–5">Variante</button>
              <button type="button" class="dd-btn" disabled title="folgt in Etappe 3–5">Als Rezept</button>
              <button type="button" class="dd-btn dd-btn--magenta" disabled title="folgt in Etappe 3–5">Für Civitai</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="dd-panel dd-history" aria-label="Verlauf">
        <h2 class="dd-label dd-label--muted">Verlauf</h2>
        <div class="dd-placeholder dd-history__empty" x-show="!history.length && !isRunning">noch keine Bilder</div>
        <div class="dd-history__list" x-show="history.length || isRunning">
          <div class="dd-placeholder dd-history__empty" x-show="isRunning">läuft …</div>
          <template x-for="entry in history" :key="entry.src">
            <button type="button" class="dd-thumb"
                    :class="{ 'is-current': entry.src === stage.image?.src }"
                    :aria-current="entry.src === stage.image?.src ? 'true' : null"
                    @click="showImage(entry)">
              <img :src="entry.src" width="96" height="168" loading="lazy" alt="Bild aus dem Verlauf">
            </button>
          </template>
        </div>
        <a class="dd-history__link" role="link" aria-disabled="true" title="folgt später">Zur Galerie</a>
      </aside>
    </div>

  </main>

</body>
</html>
